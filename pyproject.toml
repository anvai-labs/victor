[project.entry-points."victor.plugins"]
# Built-in verticals (canonical registration)
benchmark = "victor.benchmark:plugin"

# =============================================================================
# External Vertical Registration (for third-party packages)
# =============================================================================
# Third-party packages can register custom verticals with Victor by defining
# an entry point in the "victor.plugins" group.
#
# Example in external package's pyproject.toml:
#
#   [project.entry-points."victor.plugins"]
#   security = "victor_security:plugin"
#   ml_ops = "victor_mlops.plugin:plugin"
#
# Requirements for external verticals:
#   1. Publish a VictorPlugin implementation under "victor.plugins"
#   2. The plugin should register contract-authored vertical definitions via PluginContext
#   3. Vertical definitions should inherit from victor_contracts.VerticalBase
#      (the contract namespace is the canonical definition-layer API)
#   4. Runtime-only extensions/providers should be published through explicit extension groups
#
# Example plugin + vertical implementation:
#
#   from victor_contracts import VictorPlugin, PluginContext, VerticalBase, ToolNames
#
#   class SecurityAssistant(VerticalBase):
#       name = "security"
#       description = "Security vulnerability analysis assistant"
#
#       @classmethod
#       def get_name(cls):
#           return cls.name
#
#       @classmethod
#       def get_description(cls):
#           return cls.description
#
#       @classmethod
#       def get_tools(cls):
#           return [ToolNames.READ, ToolNames.GREP, "security_scan", "dependency_audit"]
#
#       @classmethod
#       def get_system_prompt(cls):
#           return "You are a security expert..."
#
#   class SecurityPlugin(VictorPlugin):
#       @property
#       def name(self):
#           return "security"
#
#       def register(self, context: PluginContext) -> None:
#           context.register_vertical(SecurityAssistant)
#
#   plugin = SecurityPlugin()
#
# Victor discovers plugins lazily via "victor.plugins" and resolves their
# registered verticals at runtime.
# =============================================================================

# =============================================================================
# Skill Registration (for verticals and third-party packages)
# =============================================================================
# Skills are composable units of expertise that bind prompts + tools.
# Verticals and external packages can register skills via entry points:
#
#   [project.entry-points."victor.skills"]
#   debug = "my_package.skills:debug_skill"
#   refactor = "my_package.skills:refactor_skill"
#
# Each entry point should resolve to a SkillDefinition instance or a
# callable returning one or a list of SkillDefinition objects.
# =============================================================================
[project.entry-points."victor.skills"]
# Built-in skills will be registered here as they are created

[tool.setuptools.packages.find]
include = ["victor", "victor.*"]
# verticals/ holds separately-installed packages (victor_coding, …) folded into
# the monorepo — they must NOT be bundled into the victor-ai dist.
exclude = ["tests*", "docs*", "victor_test*", "verticals*"]

# Ensure verticals.contrib packages are included
namespaces = true

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
# Ensure workflow/config assets are available in wheel installs.
victor = [
    "config/*.yaml",
    "config/*.yml",
    "config/*.json",
    "models/*.npz",
    # TUI stylesheet: App.CSS_PATH loads this at startup; a wheel without it
    # crashes the TUI with StylesheetError (see test_packaging_asset_contracts).
    "ui/tui/*.tcss",
    "verticals/contrib/*/*.yaml",
    "verticals/contrib/*/*.toml",
    "verticals/contrib/*/*.svg",
    "verticals/contrib/*/workflows/*.yaml",
    "verticals/contrib/*/workflows/*.svg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=victor",
    "--cov-report=",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: marks tests as integration tests (require external services)",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: marks tests as unit tests",
    "benchmark: marks performance and benchmark-oriented tests",
    "correctness: marks benchmark correctness/validation checks",
    "workflows: marks workflow-related tests",
    "agents: marks multi-agent tests",
    "hitl: marks human-in-the-loop tests",
    "monte_carlo: marks tests as Monte Carlo statistical tests",
]
filterwarnings = [
    # Ignore PytestCollectionWarning for non-test classes in victor module
    # These are data classes/enums that happen to start with "Test" (e.g., TestResult, TestRunner)
    "ignore:cannot collect test class.*because it has a __init__ constructor:pytest.PytestCollectionWarning",
    # Ignore semaphore leak warnings from multiprocessing (common in test cleanup)
    # These come from dependencies like ChromaDB, sentence_transformers
    "ignore:.*semaphore.*:ResourceWarning",
    "ignore:.*leaked.*semaphore.*:UserWarning",
    # Ignore multiprocessing resource tracker warnings
    "ignore:.*resource_tracker.*:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "archive",
    "examples",
    "docker/demos",
    "victor_test",
    "demo_workspace",
    "src",
    # Legacy UI command modules carry pre-existing lint debt; excluded here as
    # before (the old bare "ui" entry also matched victor/ui). Tracked separately.
    "victor/ui",
    "htmlcov",
    "venv",
    "game_app.py",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E402",  # module level import not at top of file (sometimes necessary)
    "F401",  # unused imports (often intentional re-exports)
    "F811",  # redefined while unused (type imports shadowing runtime)
    "B007",  # loop control variable not used within loop body
    "B008",  # do not perform function calls in argument defaults
    "B019",  # lru_cache on methods (valid pattern for class methods)
    "B023",  # function uses loop variable (common pattern)
    "B024",  # abstract class with no abstract methods (valid for protocols)
    "B025",  # try-except with empty except clause (handled elsewhere)
    "B904",  # allow broad HTTPException raising for now
    "B905",  # zip() without strict= parameter (not critical)
    "C401",  # unnecessary generator (minor optimization)
    "C414",  # unnecessary list/set call (minor optimization)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__.py
"tests/**/*.py" = [
    "B017",  # assert blind exception (common in test assertions)
    "B018",  # useless expression (for test assertions)
    "E741",  # ambiguous variable name (common in test fixtures)
    "F841",  # unused local variable (often for side-effect testing)
]

[tool.mypy]
python_version = "3.11"
# Type checking configuration - M3: Global strict mode enabled (2026-03-10)
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
exclude = [
    "^archive/",
    "^vscode-victor/",
    "^tests/",
    "^scripts/",
]
files = ["victor"]

# Strict modules milestone tracking (M1-M3)
# M1 baseline (2026-03-10): 6 modules
# M1 expansion (2026-03-10): +5 modules (total 11)
# M2 expansion (2026-03-10): +4 modules (total 15)
# M3 achievement (2026-03-10): Global strict enabled
[[tool.mypy.overrides]]
module = [
    # These modules paved the way for global strict adoption
    # M1 baseline
    "victor.config.*",
    "victor.storage.cache.*",
    "victor.telemetry.*",
    "victor.analytics.*",
    "victor.profiler.*",
    "victor.debug.*",
    # M1 expansion (2026-03-10)
    "victor.agent.services.*",
    "victor.core.container",
    "victor.core.protocols",
    "victor.providers.base",
    "victor.framework.*",
    # M2 expansion (2026-03-10)
    "victor.state.*",
    "victor.workflows.*",
    "victor.teams.*",
    "victor.integrations.api.*",
]
# Note: These modules now inherit strict=true from global config
# Keeping this override for documentation and milestone tracking

# M4: Technical debt remediation in progress (2026-03-11)
# Modules verified as type-safe (removed from ignore_errors):
[[tool.mypy.overrides]]
module = [
    # Verified type-safe in M4
    "victor.providers.*",  # 41 files
    "victor.codebase.*",  # victor/contrib/codebase: 5, victor/verticals/contrib/coding/codebase: 20
    "victor.tools.*",  # 86 files - Fixed 74 errors in language_analyzer.py
    "victor.mcp.*",  # victor/integrations/mcp: 6 files
    "victor.agent.*",  # 253 files
    "victor.native.*",  # 16 files
    "victor.verticals.*",  # 185 files
    "victor.evaluation.*",  # 37 files
    "victor.protocols.*",  # 12 files
    "victor.embeddings.*",  # victor/contrib/embeddings: 2, victor/storage/embeddings: 6
    "victor.observability.*",  # 52 files
    "victor.context.*",  # 6 files
    "victor.ui.*",  # 73 files - Fixed 2 errors in init.py
