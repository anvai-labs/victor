[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "victor-ai"
version = "0.8.3"
description = "Open-source agentic AI framework with multi-provider support, workflow orchestration, and extensible tool system"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Vijaykumar Singh", email = "singhvjd@gmail.com"}
]
requires-python = ">=3.11"
keywords = [
    "ai",
    "llm",
    "coding-agent",
    "victor",
    "anthropic",
    "openai",
    "ollama",
    "claude",
    "gpt",
    "cli",
    "terminal"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core
    "victor-contracts>=0.8.0,<1.0",  # Contract protocol definitions (independent semver)
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "typing-extensions>=4.9",  # For typing.Self on Python 3.10
    "orjson>=3.9.0",  # Fast JSON serialization (Rust-backed, 5-10x faster than stdlib)
    # Typed provider runtime and wire transport; Sandhi is a core boundary, not an extra.
    "sandhi-gateway==0.1.4",
    # Imported on the `import victor` path (core.verticals.version_matrix) and for
    # vertical version gating. Previously satisfied only transitively via dev tools —
    # a bare `pip install victor-ai` could land in an env without it.
    "packaging>=23.0",
    # Module-level import on the CLI path (processing.native similarity fallbacks,
    # semantic caches, FEP-0012 numpy-only ML inference). Previously only reachable
    # via the embeddings/dev extras, so a bare `pip install victor-ai` shipped a CLI
    # that crashed at startup. Keep the pin aligned with the embeddings extra.
    "numpy>=1.24,<2.3",

    # Async
    "httpx>=0.27",
    "aiofiles>=23.0",
    "aiohttp>=3.9",

    # CLI/UI
    # typer<0.15 (e.g. 0.12.x) is incompatible with click>=8.2: click added
    # validation that rejects --flag/--no-flag secondary opts unless is_flag is
    # set, which old typer doesn't do — every boolean CLI option then fails at
    # group-build time. Floor at a click-8.2+ aware typer; cap to satisfy
    # huggingface-hub (typer<0.26).
    "typer>=0.15,<0.26",
    "rich>=13.7",
    "prompt-toolkit>=3.0",
    "textual>=0.89",

    # LLM Providers (core - always installed)
    "anthropic>=0.34",
    "openai>=1.40",
    # Google Gemini support uses the optional google-genai extra.

    # Tools
    "gitpython>=3.1",
    "jsonschema>=4.20",
    "tiktoken>=0.7",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",

    # Code Analysis (core) — base library only; language grammars are optional
    "tree-sitter>=0.23",  # 0.23+ required for QueryCursor API
    "pygments>=2.17",

    # Caching
    "cachetools>=5.3",
    "diskcache>=5.6",
    "docstring-parser>=0.15",
    "psutil>=5.9",  # System metrics for observability and health monitoring

]

[project.optional-dependencies]
# Docker-backed surfaces: sandboxed code execution, the docker workflow service
# provider, and container deployment. Every import site is lazy/guarded
# (DOCKER_AVAILABLE pattern), so the base install degrades gracefully without it.
docker = [
    "docker>=7.0",
]
# Semantic embeddings: tool selection, conversation embeddings, codebase search
embeddings = [
    "numpy>=1.24,<2.3",  # Required by victor.storage.embeddings.service; numba-compatible
    "sentence-transformers>=2.2.0",
    "lancedb>=0.6.0",
    "pyarrow>=14.0",
]

# ProximaDB vector store / embedding provider (optional backend).
# Imported lazily with graceful ImportError fallback in
# victor/storage/vector_stores/proximadb_provider.py — degrades to other
# providers when absent. Pin kept identical to victor-coding's proximadb extra
# so the backend version stays aligned across packages.
proximadb = [
    "proximadb>=0.2,<0.3",
]

# LangChain interop: adapt LangChain tools as native Victor tools
langchain = [
    "langchain-core>=0.2.0",
]

# Reverse-proxy serve mode (FEP-0020 Phase 3): `victor gateway serve` — share one
# upstream key across a team with per-user virtual keys + budgets + metering.
# Bundles the sandhi metering core with the serve deps (fastapi + uvicorn).
gateway = [
    "fastapi>=0.109",
    "uvicorn>=0.27",
]

# Interactive examples and playground (typer, rich already in main deps)
examples = []

# Web tooling: headless browser rendering + high-quality text extraction.
# Used by web_fetch (render: browser) and by the DDG browser fallback in
# web_search/web_summarize, plus trafilatura-based content extraction. All
# import sites are lazy/guarded (the _NATIVE_AVAILABLE pattern), so the base
# install degrades to plain HTTP + BeautifulSoup without this extra.
# Install the browser binary separately:  playwright install chromium
web = [
    "playwright>=1.40",
    "trafilatura>=1.6",
]

# Web chat UI: a pure-Python Chainlit surface bound to VictorClient (`victor ui`)
chat-ui = [
    "chainlit>=2,<3",  # 2.x cl.Action uses payload= (the 1.x value= kwarg was removed)
]

# Edge-classifier TRAINING (FEP-0012) — dev-only. Runtime inference is
# numpy-only (victor.ml.features + victor.ml.model); this extra is needed only
# to run scripts/train_edge_classifier.py / victor.ml.trainer.
ml = [
    "scikit-learn>=1.4",
    "scipy>=1.10",
]

# Evaluation-only: training/loading the small ModernBERT completion judge
