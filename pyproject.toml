# Deferred explicit overrides from stash audit (2026-03-28):
# These targets still fail current mypy validation and must remain covered
# by the catch-all ignore block until their type debt is resolved.
# - victor.verticals.contrib.coding.tools.graph_tool
# - victor.verticals.contrib.coding.tools.language_analyzer
# - victor.agent.orchestrator
# - victor.processing.native.*
# - victor.observability.dashboard.app

# Remaining modules requiring type fixes
[[tool.mypy.overrides]]
module = [
    "victor.api.*",  # Doesn't exist at top level
    "victor.protocol.*",  # Doesn't exist (victor.protocols is type-safe)
    "victor.*",  # Catch-all for remaining untyped modules
]
ignore_errors = true

# M4 Status Summary (2026-03-11):
# - Removed ignore_errors for 13 modules (946 files)
# - Fixed 76 type errors:
#   * 74 in language_analyzer.py
#   * 2 in ui/commands/init.py
# - All major modules now verified type-safe
# - Remaining: Catch-all for any new/unvisited modules

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.coverage.run]
source = ["victor"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    # CLI modules require interactive terminal testing
    "victor/ui/cli.py",
    "victor/ui/commands.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
