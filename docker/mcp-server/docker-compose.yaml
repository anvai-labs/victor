services:
  victor-mcp:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: mcp
    image: victor-mcp:local
    stdin_open: true
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${VICTOR_WORKSPACE:-../../}:/workspace:rw
      - victor-config:/home/victor/.victor
volumes:
  victor-config:
