# Victor default profiles — bundled with the victor-ai package.
# victor-profiles-version: bundled
#
# On first run this file is copied to ~/.victor/profiles.yaml, which is YOURS:
# edit it freely, add profiles, change models. Bundled defaults act as a base
# layer — a profile you define with the same name always wins, and new bundled
# profiles from package upgrades appear automatically without touching your
# edits.
#
# Select a profile:            victor chat -p <name>
# Quick per-run overrides:     VICTOR_PROVIDER / VICTOR_MODEL environment vars
# API keys are NEVER stored here — provide them via environment variables
# (ANTHROPIC_API_KEY, OPENAI_API_KEY, MOONSHOT_API_KEY, ...).

profiles:
  # Primary default: self-hosted InferFlux (OpenAI-compatible, native
  # server-side tool calls, 32k effective context). Requires a reachable
  # server, e.g. from a Mac:
  #   ssh -N -L 8080:127.0.0.1:8080 vsingh@aiserver1     # tunnel first
  # Keyless deployments need nothing; if the server has api_keys configured:
  #   export INFERFLUX_API_KEY=...   (or ~/.victor/api_keys.yaml)
  # Verify: victor doctor
  default:
    provider: inferflux
    model: qwen3-coder-30b
    temperature: 0.6
    max_tokens: 8192
    description: Self-hosted InferFlux (http://127.0.0.1:8080/v1, 32k effective ctx)

  # Air-gapped path: Ollama, no API key (ollama serve + ollama pull
  # qwen2.5-coder:7b). Kept so `-p local` always means "fully offline".
  local:
    provider: ollama
    model: qwen2.5-coder:7b
    temperature: 0.6
    max_tokens: 4096
    description: Local Ollama profile (no API key required)

  # Stock llama.cpp llama-server (native tool calls via --jinja).
  # PORT NOTE: llama-server's default port 8080 is the same port the InferFlux
  # SSH tunnel occupies. While tunneled, run llama-server elsewhere
  # (llama-server -m <gguf> --jinja --port 8081) and point the profile at it:
  #   providers: { llamacpp: { base_url: "http://localhost:8081/v1" } }
  # (or leave the tunnel down and use port 8080 directly).
  local-llamacpp:
    provider: llamacpp
    model: local-model
    temperature: 0.6
    max_tokens: 8192
    description: llama.cpp llama-server (set providers.llamacpp.base_url if not :8080)

  # --- Cloud profiles (commented examples; uncomment + set env key to use) ---
  #
  # claude:
  #   provider: anthropic
  #   model: claude-sonnet-4-5
  #   temperature: 0.6
  #   max_tokens: 8192
  #   description: Anthropic Claude (ANTHROPIC_API_KEY)
  #
  # gpt:
  #   provider: openai
  #   model: gpt-4o
  #   temperature: 0.6
  #   max_tokens: 8192
  #   description: OpenAI GPT (OPENAI_API_KEY)
  #
  # Kimi K3 is active out of the box for discovery. It requires a top-up to
  # unlock (see https://platform.kimi.ai) and the MOONSHOT_API_KEY env var.
  # Set the key, then:  victor chat -p kimi
  kimi:
    provider: moonshot
    model: kimi-k3
    temperature: 0.6
    max_tokens: 8192
    description: Moonshot Kimi K3 — 1M context, always-on thinking (MOONSHOT_API_KEY)
  #
  # zai-coding:
  #   provider: zai
  #   model: glm-5.2
  #   temperature: 0.6
  #   max_tokens: 8192
  #   description: Z.AI coding-plan profile (ZAI_API_KEY)
