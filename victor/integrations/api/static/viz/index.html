<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Victor Code Explorer</title>
<link rel="stylesheet" href="assets/explorer.css">
<script src="assets/vendor/cytoscape.min.js"></script>
<script src="assets/vendor/cytoscape-dagre.min.js"></script>
</head>
<body>
<header>
  <h1>Victor Code Explorer</h1>
  <nav>
    <button id="btn-package" class="active">Packages</button>
    <button id="btn-module" disabled>Module</button>
    <button id="btn-class" disabled>Class</button>
    <button id="btn-back" disabled>&larr; Back</button>
  </nav>
  <form id="search-form">
    <input id="search-input" type="search" placeholder="Search symbols..." autocomplete="off">
    <button type="submit">Search</button>
  </form>
</header>
<main>
  <aside id="inspector">
    <h2>Node</h2>
    <div id="inspector-body"><p class="hint">Select a node to inspect.</p></div>
  </aside>
  <div id="cy"></div>
</main>
<script src="assets/explorer.js"></script>
</body>
</html>
