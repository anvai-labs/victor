[workspace]
members = [
    "crates/protocol",
    "crates/state",
    "crates/tools",
    "crates/edge-runtime",
    "crates/python-bindings",
]
resolver = "2"

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Vijaykumar Singh <vijay@anvaiops.com>"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# unwind, not abort: with abort, any Rust panic KILLED the whole Python
# process. With unwind, pyo3 converts #[pymethods] panics into a
# PanicException that derives from BaseException (like SystemExit), so the
# process survives — and the Python-side shims catch it BY NAME to degrade
# to the fallback (a plain `except Exception` never sees it; adversarial-
# review finding).
panic = "unwind"

[profile.release-with-debug]
inherits = "release"
debug = true

# Workspace-wide lint configuration
[workspace.lints.clippy]
# Deny common mistakes
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
# Performance lints
clone_on_ref_ptr = "warn"
large_types_passed_by_value = "warn"
linkedlist = "warn"
# Style lints
module_name_repetitions = "allow"
too_many_arguments = "allow"
# Documentation
missing_docs_in_private_items = "allow"

[workspace.dependencies]
# Shared dependency versions across workspace
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
ahash = "0.8"
parking_lot = "0.12"
