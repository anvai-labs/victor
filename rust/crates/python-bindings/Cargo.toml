[package]
name = "victor_native"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "High-performance native extensions for Victor AI framework"
readme = "../../README.md"
publish = false

[lib]
name = "victor_native"
crate-type = ["cdylib"]

[dependencies]
# Workspace crates
victor-protocol = { path = "../protocol" }

# PyO3 for Python bindings. The extension-module feature is enabled only for
# maturin builds so cargo tests can link against libpython normally.
pyo3 = { version = "0.22" }

# Fast hashing
ahash = "0.8"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# SIMD operations (portable across architectures)
wide = "0.7"

# JSON parsing for repair
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

# YAML parsing for workflow acceleration
serde_yaml = "0.9"

# Gzip decompression for usage.jsonl.gz trace scanning
flate2 = "1.0"

# Parallel processing
rayon = "1.10"

# Memory-efficient collections
smallvec = "1.13"

# Multi-pattern matching (Aho-Corasick algorithm)
aho-corasick = "1.1"

# LRU cache for memoization
lru = "0.12"

# Lazy static initialization
once_cell = "1.19"

# Fast synchronization primitives
parking_lot = "0.12"

# Fast byte scanning (memchr for optimized newline/search operations)
memchr = "2.7"

# Regex for pattern compilation (optional fallback)
regex = "1.10"

[features]
default = ["text", "embeddings"]

# Build as a Python extension module. Enabled by rust/pyproject.toml for maturin.
extension-module = ["pyo3/extension-module"]

# Enable SIMD optimizations (auto-detected at runtime)
simd = []

# Domain-specific feature flags for conditional compilation.
# Each gate a group of related modules so consumers only pay for what they use.

# Text processing: tokenizer, chunking, context fitting, dedup, sanitizer,
# argument normalization, pattern matching
text = []

# Embeddings: quantized embeddings, similarity computation, KNN graph
embeddings = []

# Graph algorithms: pagerank, centrality, connected components, cycle detection
graph = []

# Security: secret scanning, trace scanning
security = []

# Codecs: JSON repair, YAML loading, extraction
codecs = []

# AI/ML utilities: classification, thinking detection, streaming filter
ai = []

# AST indexing: stdlib detection, identifier extraction
ast = []

# Everything enabled
full = ["text", "embeddings", "graph", "security", "codecs", "ai", "ast"]

[lints]
workspace = true
