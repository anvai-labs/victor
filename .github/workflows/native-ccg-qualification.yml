name: Native CCG Wheel Qualification

on:
  pull_request:
    paths:
      - 'rust/**'
      - 'victor/core/indexing/ccg_builder.py'
      - 'victor/core/graph_rag/control_dependence.py'
      - 'victor/processing/native/ccg_extract.py'
      - 'scripts/ci/check_native_ccg_wheel.py'
      - 'tests/unit/processing/native/test_ccg_extract.py'
      - '.github/workflows/native-ccg-qualification.yml'
  push:
    branches: [develop, main]
    paths:
      - 'rust/**'
      - 'victor/core/indexing/ccg_builder.py'
      - 'victor/core/graph_rag/control_dependence.py'
      - 'victor/processing/native/ccg_extract.py'
      - 'scripts/ci/check_native_ccg_wheel.py'
      - '.github/workflows/native-ccg-qualification.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: native-ccg-qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel:
    name: CCG wheel (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # macOS support is Apple Silicon only; Intel macOS is not a release platform.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
        python: ['3.12', '3.13']
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    env:
      RUSTFLAGS: '-C target-cpu=generic'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust
          key: ccg-wheel-${{ matrix.python }}
      - name: Build portable release wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: rust
          target: ${{ matrix.target }}
          args: ${{ runner.os == 'Linux' && format('--release --locked --out dist -i python{0}', matrix.python) || '--release --locked --out dist -i python' }}
          manylinux: auto
      - name: Install exact wheel without core or optional extras
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          wheels = list(Path('rust/dist').glob('*.whl'))
          assert len(wheels) == 1, wheels
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', str(wheels[0])], check=True)
          PY
      - name: Exercise installed schema, physical identities and Unicode
        run: python scripts/ci/check_native_ccg_wheel.py > native-ccg-wheel-check.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-wheels-${{ matrix.target }}-py${{ matrix.python }}
          if-no-files-found: error
          path: rust/dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-ccg-check-${{ matrix.os }}-py${{ matrix.python }}
          if-no-files-found: error
          path: native-ccg-wheel-check.json
