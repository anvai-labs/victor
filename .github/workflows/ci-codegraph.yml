# CI for the victor-codegraph package (editable install).
# Runs on PRs/pushes that touch the package. Tree-sitter grammars are installed via the
# [dev] extra so the JS/TS extraction tests actually exercise the grammar pack (not skip).

name: CI - codegraph

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Editable install (local victor-contracts + package with dev/tree-sitter)
        run: |
          python -m pip install --upgrade pip
          pip install -e ./victor-contracts
          pip install -e "./victor-codegraph[dev]"
          pip install pytest-cov

      - name: Load required tree-sitter grammars
        run: |
          python - <<'PYTHON'
          import time
          from tree_sitter import Parser
          from tree_sitter_language_pack import get_language

          # Recent grammar packs download native libraries lazily. Make that
          # setup explicit: tests must not silently skip unavailable grammars.
          for language in ("javascript", "typescript", "go", "rust", "java", "c", "cpp"):
              for attempt in range(3):
                  try:
                      Parser(get_language(language))
                      print(f"Loaded {language}", flush=True)
                      break
                  except Exception as error:
                      print(f"::warning::Grammar {language} attempt {attempt + 1}: {error}", flush=True)
                      if attempt == 2:
                          raise
                      time.sleep(2 ** attempt)
          PYTHON

      - name: Lint (ruff)
        working-directory: victor-codegraph
        run: ruff check victor_codegraph tests

      - name: Test
        working-directory: victor-codegraph
        run: |
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            pytest tests -v --tb=short \
              --cov=victor_codegraph \
              --cov-report=term-missing \
              --cov-report=xml:coverage.xml \
              --cov-fail-under=90
          else
            pytest tests -v --tb=short
          fi

  summary:
    name: Codegraph Summary
    runs-on: ubuntu-24.04
    needs: test
    if: always()
    steps:
      - name: Require every supported Python and the coverage floor
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::Codegraph tests or coverage did not pass."
            exit 1
          fi
