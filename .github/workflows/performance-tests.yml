name: Performance Regression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run performance tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual triggering

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  checks: write
  pull-requests: write  # Allow commenting on PRs with benchmark results

jobs:
  performance-regression:
    name: Performance Regression Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      matrix:
        python-version: ['3.12']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history for comparison

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y victor victor-ai victor-contracts || true
          if [ -d ./victor-contracts ]; then
            pip install --no-cache-dir -e ./victor-contracts
          elif [ -d ./victor-sdk ]; then
            pip install --no-cache-dir -e ./victor-sdk
          fi
          pip install -e ".[dev,benchmark,checkpoints]"
          if [ -d ./victor-contracts ]; then
            pip install --no-cache-dir --no-deps -e ./victor-contracts
          elif [ -d ./victor-sdk ]; then
            pip install --no-cache-dir --no-deps -e ./victor-sdk
          fi
          pip install pytest-benchmark

      - name: Run performance tests
        run: |
          pytest tests/performance/ \
            --benchmark-only \
            --benchmark-json=output.json \
            --benchmark-autosave \
            --benchmark-sort=mean \
            -v

      - name: Store benchmark result (skipped - gh-pages restricted)
        run: |
          echo "Benchmark results will be stored as workflow artifacts instead of gh-pages"
          echo "This works around repository branch creation restrictions"

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results-${{ matrix.python-version }}
          path: |
            output.json
            .benchmarks/
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('output.json', 'utf8'));

            let comment = '## 📊 Performance Test Results\n\n';

            // Summarize key benchmarks
            const benchmarks = [
              'test_register_100_items',
              'test_register_1000_items',
              'test_batch_register_100_items',
              'test_batch_register_1000_items',
            ];

            comment += '| Test | Mean (ms) | Min (ms) | Max (ms) |\n';
            comment += '|------|-----------|----------|----------|\n';

            for (const bench of benchmarks) {
              if (data.benchmarks[bench]) {
                const stats = data.benchmarks[bench].stats;
                comment += `| ${bench} | ${stats.mean.toFixed(3)} | ${stats.min.toFixed(3)} | ${stats.max.toFixed(3)} |\n`;
              }
            }

            comment += '\n🔗 Full results available in the workflow artifacts.';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  dist-metrics:
    name: Distribution Metrics (bare wheel)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Budget tracker, not a gate (yet): records size/dep-count/CLI-timings for a
    # bare wheel install on the daily schedule and main pushes. The blocking
    # gates run at release time (bare-install-smoke in release.yml).
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Measure bare-wheel install
        run: |
          python scripts/ci/dist_metrics.py \
            --mode venv-wheel \
            --wheel dist/victor_ai-*.whl \
            --iterations 5 \
            --json dist-metrics.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload distribution metrics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-metrics
          path: dist-metrics.json
          retention-days: 90

  baseline-comparison:
    name: Compare to Baseline
    runs-on: ubuntu-24.04
    needs: performance-regression
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}  # Checkout base branch for baseline

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y victor victor-ai victor-contracts || true
          if [ -d ./victor-contracts ]; then
            pip install --no-cache-dir -e ./victor-contracts
          elif [ -d ./victor-sdk ]; then
            pip install --no-cache-dir -e ./victor-sdk
          fi
          pip install -e ".[dev,benchmark,checkpoints]"
          if [ -d ./victor-contracts ]; then
            pip install --no-cache-dir --no-deps -e ./victor-contracts
          elif [ -d ./victor-sdk ]; then
            pip install --no-cache-dir --no-deps -e ./victor-sdk
          fi

      - name: Use the PR's test toolchain for the baseline
        # The baseline measures the BASE branch's code, but must run under the
        # PR's test runner: a tool pin added on the head (pytest<9.2, #1553) is
        # absent from the base until promotion, and the base's unpinned pytest
        # 9.2 breaks pytest-benchmark (Function._nodeid) for every benchmark.
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          git show "$HEAD_SHA:pyproject.toml" > "$RUNNER_TEMP/head-pyproject.toml"
          mapfile -t SPECS < <(python - "$RUNNER_TEMP/head-pyproject.toml" <<'PY'
          import re, sys, tomllib
          with open(sys.argv[1], "rb") as fh:
              dev = tomllib.load(fh)["project"]["optional-dependencies"]["dev"]
          for spec in dev:
              name = re.split(r"[\s<>=!~;\[]", spec, maxsplit=1)[0].lower()
              if name in {"pytest", "pytest-benchmark", "pytest-asyncio"}:
                  print(spec)
          PY
          )
          echo "Head test toolchain: ${SPECS[*]}"
          if [ ${#SPECS[@]} -eq 0 ]; then
            echo "::error::no pytest requirement found in the head pyproject dev extra"
            exit 1
          fi
          pip install "${SPECS[@]}"
          pip list 2>/dev/null | grep -iE '^(pytest|pytest-benchmark|pytest-asyncio) '

      - name: Run baseline tests
        run: |
          pytest tests/performance/ \
            --benchmark-only \
            --benchmark-json=baseline.json \
            --benchmark-sort=mean \
            -v

      - name: Upload baseline
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-results
          path: baseline.json

      - name: Download current results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: benchmark-results-3.12
          path: .

      - name: Compare results
        run: |
          pip install pytest-benchmark
          pytest-benchmark compare baseline.json output.json \
            --sort=mean \
            --columns=mean,stddev,ops

      - name: Check for regressions
        # Warn-only for now (owner decision): regressions surface as ::warning::
        # annotations plus a step-summary table; switch --mode to fail once the
        # noise policy has a track record. The job checks out the BASE branch, so
        # take the comparison script from the PR head like the toolchain step.
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          git show "$HEAD_SHA:scripts/ci/benchmark_regressions.py" \
            > "$RUNNER_TEMP/benchmark_regressions.py"
          python "$RUNNER_TEMP/benchmark_regressions.py" baseline.json output.json \
            --mode warn --threshold 20

  notify:
    name: Notify on failure
    runs-on: ubuntu-24.04
    needs: [performance-regression, baseline-comparison]
    if: failure()

    steps:
      - name: Send notification
        run: |
          echo "Performance tests failed. Check workflow logs for details."
          # Add actual notification logic here (e.g., Slack, email)

  performance-summary:
    name: Performance Summary
    runs-on: ubuntu-24.04
    needs: [performance-regression, baseline-comparison]
    # The baseline comparison exists only for pull requests. Keep scheduled,
    # push, and manual benchmark runs useful without manufacturing a red
    # summary from that intentional skip.
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Require benchmark and regression comparison green
        run: |
          if [ "${{ needs.performance-regression.result }}" != "success" ] || \
             [ "${{ needs.baseline-comparison.result }}" != "success" ]; then
            echo "::error::Performance benchmark or baseline comparison did not pass."
            exit 1
          fi
