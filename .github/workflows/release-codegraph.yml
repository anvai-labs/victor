# Release workflow for victor-codegraph — independent of victor-ai / victor-contracts.
#
# Triggers:
#   - Push tag: victor-codegraph-v*  (e.g. victor-codegraph-v0.1.0)
#   - Manual dispatch (optionally TestPyPI only)
#
# Publishing uses PyPI Trusted Publishing (OIDC) — NO API token secret required.
# PyPI requires the exact package tag; an explicit TestPyPI rehearsal cannot publish
# to production. Both destinations enforce package/runtime/pin and artifact versions.
# To configure on the PyPI side (one-time):
#   1. Create the project owner / pending publisher at https://pypi.org/manage/account/publishing/
#   2. Add a "GitHub" trusted publisher:
#        owner   = anvai-labs
#        repo    = victor
#        workflow= release-codegraph.yml
#        environment = pypi   (and `testpypi` for the TestPyPI publisher)
#   3. (No secrets to add — OIDC handles auth via `permissions: id-token: write`.)

name: Release codegraph

on:
  push:
    tags:
      - 'victor-codegraph-v*'
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: 'Publish to TestPyPI only'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.12'

jobs:
  release-plan:
    name: Validate CodeGraph release versions and destination
    runs-on: ubuntu-24.04
    outputs:
      production: ${{ steps.plan.outputs.production }}
      testpypi: ${{ steps.plan.outputs.testpypi }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: plan
        run: python scripts/ci/release_contract.py plan --package victor-codegraph

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: release-plan
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Editable install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./victor-contracts
          pip install -e "./victor-codegraph[dev]"
      - name: Test
        working-directory: victor-codegraph
        run: pytest tests -v --tb=short

  build:
    name: Build package
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build tools
        run: pip install build twine
      - name: Build sdist + wheel
        working-directory: victor-codegraph
        run: python -m build
      - name: Check metadata
        run: |
          twine check victor-codegraph/dist/*
          python scripts/ci/release_contract.py package-artifacts victor-codegraph/dist
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: codegraph-dist
          path: victor-codegraph/dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [release-plan, build]
    if: needs.release-plan.outputs.testpypi == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/victor-codegraph/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codegraph-dist
          path: dist/
      - name: Verify downloaded package versions
        run: python scripts/ci/release_contract.py package-artifacts dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: [release-plan, build]
    if: needs.release-plan.outputs.production == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/victor-codegraph/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codegraph-dist
          path: dist/
      - name: Verify downloaded package versions
        run: python scripts/ci/release_contract.py package-artifacts dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          verbose: true
