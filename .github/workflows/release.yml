# Victor-AI Release Workflow
# Automatically builds and publishes victor-ai when a tag is pushed
#
# Triggers:
#   - Push tag: v* (e.g., v0.1.0, v1.0.0-beta) — excludes sdk-v* tags
#   - Manual dispatch for testing
#
# For contract-only releases, see release-sdk.yml (triggered by sdk-v* tags)
#
# Outputs:
#   - PyPI package (and TestPyPI for pre-releases)
#   - Standalone binaries (macOS ARM64, Linux x64/ARM64, Windows x64)
#   - Docker image (multi-arch)
#   - GitHub Release with checksums
#
# Installation:
#   pip install victor-ai
#   pipx install victor-ai
#   brew install vijayksingh/tap/victor

name: Release

on:
  push:
    tags:
      # victor-ai releases only. Sibling packages have their own release-*.yml workflows,
      # but their 'v'-prefixed tags also match 'v*' and would spuriously trigger this run
      # (each wasted ~30 min before failing). Exclude every sibling tag pattern here whenever
      # a new release-*.yml is added.
      - 'v*'
      - '!sdk-v*'                 # release-contracts.yml
      - '!victor-codegraph-v*'   # release-codegraph.yml
      - '!verticals-v*'          # release-verticals.yml
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: 'Publish to TestPyPI only'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.12'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-plan:
    name: Validate Release Destinations
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      production: ${{ steps.plan.outputs.production }}
      github_release: ${{ steps.plan.outputs.github_release }}
      testpypi: ${{ steps.plan.outputs.testpypi }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: plan
        run: python scripts/ci/release_contract.py plan

  # ==========================================================================
  # Smoke test before release (full testing done by CI shards on PR)
  # ==========================================================================
  test:
    name: Smoke Test
    needs: release-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ./victor-contracts
          pip install -e ".[embeddings]"

      - name: Verify imports and CLI
        run: |
          python -c "from victor import Agent, __version__; print(f'victor {__version__}')"
          python -c "from victor.framework.graph import StateGraph; print('StateGraph OK')"
          victor --version
          victor --help

      - name: Lint
        run: |
          python -m pip install "$(python scripts/ci/release_contract.py ruff)"
          ruff check victor

  # ==========================================================================
  # Verify version sync
  # ==========================================================================
  version-check:
    name: Version Sync Check
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check version consistency
        run: python scripts/check_version_sync.py

  # ==========================================================================
  # Build Python package (victor-ai only; SDK is released independently)
  # ==========================================================================
  build-python:
    name: Build Python Package
    needs: version-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: |
          pip install build twine

      - name: Build victor-ai
        run: |
          python -m build

      - name: Check victor-ai package
        run: |
          twine check dist/*

      - name: Upload victor-ai artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: python-package
          path: dist/

  # ==========================================================================
  # Build native extensions (Rust via maturin)
  # ==========================================================================
  build-native:
    name: Build Native (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64 — maturin runs in the manylinux container, which has python3.10–3.14;
          # name 3.12–3.13 explicitly to match the project's tested native-wheel range.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            maturin_args: "--release --out dist -i python3.12 python3.13"
          # Linux ARM64 (Graviton, Ampere, Raspberry Pi 5)
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            maturin_args: "--release --out dist -i python3.12 python3.13"
          # macOS ARM64 (M1/M2/M3/M4) — runs natively; build for the active setup-python
          # (3.12), which avoids the runner's Homebrew python@3.14.
          - os: macos-latest
            target: aarch64-apple-darwin
            maturin_args: "--release --out dist"
          # macOS x86_64 (Intel) — cross-compile from ARM64 runner.
          - os: macos-latest
            target: x86_64-apple-darwin
            maturin_args: "--release --out dist --target x86_64-apple-darwin -i python3.12"
            rust_target: x86_64-apple-darwin
          # Windows x64 — runs natively; build for the active setup-python (3.12).
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            maturin_args: "--release --out dist"
          # NOTE: Windows ARM64 requires a native ARM64 runner (GitHub Actions
          # doesn't offer one yet). The cross-compile from x64 fails because
          # maturin can't find a CPython interpreter for aarch64-pc-windows-msvc.
          # Add this back when GitHub offers windows-arm64 runners.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}${{ matrix.rust_target != '' && format(', {0}', matrix.rust_target) || '' }}

      - name: Update rustup to stable
        run: |
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version

      - name: Install maturin
        run: pip install maturin

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          working-directory: rust
          target: ${{ matrix.target }}
          # Per-OS args (see matrix): Linux pins 3.12–3.13 in the manylinux container;
          # macOS/Windows build for the active setup-python to match that tested range.
          args: ${{ matrix.maturin_args }}
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: native-wheels-${{ matrix.target }}
          path: rust/dist/*.whl

  # ==========================================================================
  # Build standalone binaries
  # ==========================================================================
  build-binary:
    name: Build Binary (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM64 (M1/M2/M3/M4)
          - os: macos-latest
            platform: macos
            arch: arm64
          # Linux x64 (native runner; core is ML-free since the lean-default
          # move, so PyInstaller no longer drags torch). ARM64 is pending
          # sandhi-gateway publishing a manylinux-aarch64 wheel — until then
          # the pinned sandhi-gateway cannot install on that platform (which
          # also affects pip installs there, independent of binaries).
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          # Windows x64
          - os: windows-latest
            platform: windows
            arch: x64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          # victor-contracts is an in-repo package (not on PyPI); install it first so
          # victor-ai's `victor-contracts>=0.6.0,<1.0` dependency resolves locally instead
          # of failing with "No matching distribution found for victor-contracts".
          pip install -e ./victor-contracts
          pip install -e ".[build]"

      - name: Build binary
        run: |
          python scripts/build_binary.py --onefile --output victor

      - name: Smoke test binary (Unix)
        if: runner.os != 'Windows'
        run: |
          # Cold run exercises the onefile extraction; a broken archive fails
          # here. No GNU `timeout` on macOS runners — the job timeout bounds a
          # hang, and a broken archive fails fast on its own.
          dist/victor --version
          # Warm run asserts the extraction cache reuse.
          dist/victor --version
          dist/victor --help | head -5 | grep -q "Usage"
          # Tripwire: accidental ML-stack bundling would blow past this.
          size_mb=$(du -m dist/victor | cut -f1)
          echo "binary size: ${size_mb}MB"
          [ "$size_mb" -lt 500 ]

      - name: Smoke test binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dist\victor.exe --version
          dist\victor.exe --help | Select-Object -First 5 | Out-Null
          $size = (Get-Item dist\victor.exe).Length / 1MB
          Write-Output "binary size: $([math]::Round($size))MB"
          if ($size -gt 500) { exit 1 }

      - name: Create archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cd dist
          tar -czvf victor-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz victor*
          mv victor-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz ../

      - name: Create archive (Windows)
        if: runner.os == 'Windows'
        run: |
          cd dist
          Compress-Archive -Path victor* -DestinationPath ../victor-${{ matrix.platform }}-${{ matrix.arch }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: binary-${{ matrix.platform }}-${{ matrix.arch }}
          path: victor-${{ matrix.platform }}-${{ matrix.arch }}.*

  # ==========================================================================
  # Build Docker image (build only, push later after all checks pass)
  # ==========================================================================
  build-docker:
    name: Build Docker Image
    needs: [test, release-plan]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free up disk space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h /
          # Remove large unused packages to free up ~25GB
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          # Clean apt cache
          sudo apt-get clean
          # Clean Docker cache
          docker system prune -af --volumes || true
          echo "=== Disk space after cleanup ==="
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract version
        id: version
        run: echo "VERSION=${{ needs.release-plan.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image (without push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: |
            vjsingh1984/victor-ai:${{ steps.version.outputs.VERSION }}
            vjsingh1984/victor-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/victor-docker.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: docker-image
          path: /tmp/victor-docker.tar
          retention-days: 1

  # ==========================================================================
  # Security scan Docker image with Trivy
  # ==========================================================================
  security-scan:
    name: Security Scan (Trivy)
    needs: [build-docker, release-plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image
          path: /tmp/
      - name: Load Docker image
        run: docker load -i /tmp/victor-docker.tar
      - name: Extract version
        id: version
        run: echo "VERSION=${{ needs.release-plan.outputs.version }}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/security-scan
        with:
          scope: container
          scan-type: image
          image-ref: vjsingh1984/victor-ai:${{ steps.version.outputs.VERSION }}
          minimum: HIGH
          category: release-container

  build-vscode:
    name: Build VS Code Extension
    needs: test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: vscode-victor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: vscode-victor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Compile TypeScript
        run: npm run compile

      - name: Run tests
        run: xvfb-run -a npm test
        env:
          CI: true

      - name: Package extension (VSIX)
        run: |
          npx --no-install vsce package --no-dependencies

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: vscode-extension
          path: vscode-victor/*.vsix

  # ==========================================================================
  # NOTE: All publishing jobs run AFTER all builds and release creation
  # This ensures we don't publish to PyPI/Docker Hub if any build fails
  # ==========================================================================

  # ==========================================================================
  # Publish to TestPyPI (for pre-releases or manual testing)
  # ==========================================================================
  # ==========================================================================
  # Bare-install smoke: the wheel must work with NO extras and NO numpy.
  # The regular smoke test installs .[embeddings], which masks bare-install
  # breaks; this is the release gate for the numpy-optional core. Also runs
  # the distribution-metrics gates (size / CLI timings / numpy absence).
  # ==========================================================================
  bare-install-smoke:
    name: Bare Install Smoke (no extras, no numpy)
    needs: [release-plan, build-python]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Download victor-ai artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package
          path: dist/

      - name: Bare install (no extras)
        run: |
          python -m venv .venv-bare
          .venv-bare/bin/pip install --quiet dist/victor_ai-*.whl
          if .venv-bare/bin/pip list | grep -qi '^numpy '; then
            echo "::error::numpy leaked into a bare install"
            exit 1
          fi

      - name: Prove the CLI chain works without numpy
        run: |
          .venv-bare/bin/victor --version
          .venv-bare/bin/victor --help > /dev/null
          .venv-bare/bin/python - <<'PY'
          from importlib.resources import files

          from victor.processing.native import batch_cosine_similarity

          scores = batch_cosine_similarity(
              [1.0, 0.0, 1.0], [[1.0, 0.0, 1.0], [0.0, 1.0, 0.0]]
          )
          assert len(scores) == 2 and abs(scores[0] - 1.0) < 1e-6, scores

          from victor.ml.model import EdgeClassifierModel

          artifact = files("victor") / "models" / "edge_classifier_v1.npz"
          model = EdgeClassifierModel.load(str(artifact))
          label, conf = model.predict("stage_detection", "run the parser tests")
          assert conf >= 0.0
          print("BARE_INSTALL_OK")
          PY

      - name: Distribution metrics gates (size / CLI timings / numpy absent)
        run: |
          # Timing budgets are runner-realistic (shared runners are ~2x slower
          # than a dev machine — the 0.12.0 rehearsal tripped 1500ms with a
          # 2030ms warm --version). They still catch 5s-class regressions.
          python scripts/ci/dist_metrics.py \
            --mode env \
            --python .venv-bare/bin/python \
            --iterations 5 \
            --json dist-metrics-release.json \
            --expect-no-numpy \
            --max-help-ms 3000 \
            --max-version-ms 3000 \
            --max-install-mb 200

      - name: Upload release distribution metrics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: dist-metrics-release
          path: dist-metrics-release.json
          retention-days: 90

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [release-plan, build-python, generate-checksums, security-scan, bare-install-smoke]
    if: needs.release-plan.outputs.testpypi == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/victor-ai/
    permissions:
      id-token: write

    steps:
      - name: Download victor-ai artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package
          path: dist/

      - name: Publish victor-ai to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

  # ==========================================================================
  # Publish to PyPI (Trusted Publishing - no API token needed)
  # SDK is published independently via release-sdk.yml
  # ==========================================================================
  publish-pypi:
    name: Publish victor-ai to PyPI
    needs: [release-plan, build-python, generate-checksums, create-release, publish-native-pypi, bare-install-smoke]
    if: needs.release-plan.outputs.production == 'true'
    runs-on: ubuntu-24.04
    # Uniform with release-contracts/-codegraph/-verticals: the trusted publisher for
    # victor-ai on PyPI must be registered with environment = pypi (matches this claim).
    environment:
      name: pypi
      url: https://pypi.org/project/victor-ai/
    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package
          path: dist/

      - name: Publish victor-ai to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          verbose: true

  # ==========================================================================
  # Publish native wheels (Rust extensions) to PyPI as victor_native
  # These provide 2-50x speedups for tokenization, similarity, JSON repair,
  # pattern matching, context fitting, and more. Users install via:
  #   pip install victor-ai[native]
  # ==========================================================================
  publish-native-pypi:
    name: Publish Native Wheels to PyPI
    needs: [release-plan, build-native, create-release]
    if: needs.release-plan.outputs.production == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/victor-native/
    permissions:
      id-token: write

    steps:
      - name: Download all native wheel artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-wheels-*
          merge-multiple: true
          path: dist/

      - name: Publish victor_native to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          verbose: true

  # ==========================================================================
  # Publish Docker image to Docker Hub
  # IMPORTANT: This runs LAST after all builds pass and release is created
  # ==========================================================================
  publish-docker:
    name: Publish Docker Image
    # build-docker is required: it uploads the `docker-image` artifact this job downloads.
    # Without it, publish can start before the artifact exists ("Artifact not found").
    needs: [release-plan, build-docker, build-python, generate-checksums, create-release]
    if: needs.release-plan.outputs.production == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image
          path: /tmp/

      - name: Load Docker image
        run: docker load -i /tmp/victor-docker.tar

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${{ needs.release-plan.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Push Docker image
        run: |
          docker push vjsingh1984/victor-ai:${{ steps.version.outputs.VERSION }}
          docker push vjsingh1984/victor-ai:latest

  # ==========================================================================
  # Generate checksums for all artifacts
  # ==========================================================================
  generate-sbom:
    name: Generate SBOM
    needs: [build-python]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install cyclonedx-bom
        run: pip install cyclonedx-bom

      - name: Generate CycloneDX SBOM
        run: |
          # victor-contracts is an in-repo package (not on PyPI); install it first so
          # victor-ai's `victor-contracts>=0.6.0,<1.0` dependency resolves locally.
          pip install -e ./victor-contracts
          pip install -e ".[embeddings]"
          cyclonedx-py environment -o sbom.json --output-format json
          cyclonedx-py environment -o sbom.xml --output-format xml

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: sbom
          path: |
            sbom.json
            sbom.xml

  generate-checksums:
    name: Generate Checksums
    needs: [build-python, build-native, build-binary, build-vscode, generate-sbom]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '{python-package,native-wheels-*,binary-*,vscode-extension,sbom}'
          path: artifacts/

      - name: Generate SHA256 checksums
        run: |
          python scripts/ci/release_contract.py checksums artifacts checksums.txt
          cat checksums.txt

      - name: Upload checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: checksums
          path: checksums.txt

  # ==========================================================================
  # Create GitHub Release (before PyPI/Docker publishing)
  # ==========================================================================
  create-release:
    name: Create GitHub Release
    needs: [release-plan, build-python, generate-checksums, security-scan, bare-install-smoke]
    if: needs.release-plan.outputs.github_release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '{python-package,native-wheels-*,binary-*,vscode-extension,sbom,checksums}'
          path: artifacts/

      - name: Extract version
        id: version
        run: echo "VERSION=${{ needs.release-plan.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          cat > CHANGELOG.md << 'RELEASE_NOTES'
          ## What's Changed

          RELEASE_NOTES
          # Get commits since last tag
          if previous_tag=$(git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD^); then
            git log --oneline "${previous_tag}..HEAD" >> CHANGELOG.md
          else
            git log --oneline HEAD >> CHANGELOG.md
          fi
          cat >> CHANGELOG.md << RELEASE_NOTES

          ## Installation

          ### Using pip (recommended)
          \`\`\`bash
          pip install victor-ai==${{ steps.version.outputs.VERSION }}
          \`\`\`

          ### Using pipx (isolated environment)
          \`\`\`bash
          pipx install victor-ai==${{ steps.version.outputs.VERSION }}
          \`\`\`

          ### Using Homebrew (macOS/Linux)
          \`\`\`bash
          brew install vijayksingh/tap/victor
          \`\`\`

          ### Using Docker
          \`\`\`bash
          docker pull vjsingh1984/victor-ai:${{ steps.version.outputs.VERSION }}
          docker run -it --rm vjsingh1984/victor-ai:${{ steps.version.outputs.VERSION }}
          \`\`\`

          ## Platform Binaries

          | Platform | Architecture | Download |
          |----------|--------------|----------|
          | macOS | ARM64 (M1/M2/M3/M4) | \`victor-macos-arm64.tar.gz\` |
          | Windows | x64 | \`victor-windows-x64.zip\` |
          | Linux | x64 (ARM64: pip, pending a sandhi aarch64 wheel) | \`victor-linux-x64.tar.gz\`, or \`pip install victor-ai\` |

          ## Verification

          Verify downloads using checksums in \`checksums.txt\`:
          \`\`\`bash
          sha256sum -c checksums.txt
          \`\`\`
          RELEASE_NOTES

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Victor v${{ steps.version.outputs.VERSION }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ needs.release-plan.outputs.prerelease == 'true' }}
          files: |
            artifacts/python-package/*
            artifacts/binary-*/*
            artifacts/native-wheels-*/*
            artifacts/vscode-extension/*
            artifacts/sbom/*
            artifacts/checksums/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================================================
  # Homebrew formula auto-updates via polling in vjsingh1984/homebrew-tap
  # No action needed here - the tap checks for new releases every 6 hours
  # ==========================================================================
