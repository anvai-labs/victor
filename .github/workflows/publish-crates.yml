name: Publish Rust crates

on:
  push:
    tags:
      - 'rust-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing rust-vX.Y.Z tag to publish (without rust-v)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crates-io-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('rust-v{0}', inputs.version) || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate release version and credential
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          release_version="${REQUESTED_VERSION#rust-v}"
          manifest_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"

          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not configured"
            exit 1
          fi
          if [ "$manifest_version" != "$release_version" ]; then
            echo "::error::rust-v${release_version} does not match workspace version ${manifest_version}"
            exit 1
          fi

      - name: Test workspace
        working-directory: rust
        run: cargo test --workspace --locked

      - name: Publish in dependency order
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail

          release_version="${REQUESTED_VERSION#rust-v}"
          user_agent="victor-crates-publisher/${release_version} (https://github.com/anvai-labs/victor)"

          wait_for_registry() {
            crate="$1"
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error \
                --user-agent "$user_agent" \
                "https://crates.io/api/v1/crates/${crate}/${release_version}" \
                >/dev/null; then
                return 0
              fi
              echo "Waiting for ${crate} ${release_version} to reach the crates.io index (${attempt}/30)"
              sleep 10
            done
            echo "::error::${crate} ${release_version} did not appear on crates.io"
            return 1
          }

          publish_crate() {
            crate="$1"
            if curl --fail --silent \
              --user-agent "$user_agent" \
              "https://crates.io/api/v1/crates/${crate}/${release_version}" \
              >/dev/null; then
              echo "${crate} ${release_version} already exists; skipping"
            else
              cargo publish -p "$crate" --locked
            fi
            wait_for_registry "$crate"
          }

          publish_crate victor-protocol
          publish_crate victor-state
          publish_crate victor-tools
          publish_crate victor-edge

      - name: Record published crates
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          release_version="${REQUESTED_VERSION#rust-v}"
          {
            echo "## crates.io publication complete"
            echo
            echo "- victor-protocol ${release_version}"
            echo "- victor-state ${release_version}"
            echo "- victor-tools ${release_version}"
            echo "- victor-edge ${release_version}"
          } >> "$GITHUB_STEP_SUMMARY"
