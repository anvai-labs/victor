# GitHub Actions workflow for building and deploying MkDocs documentation to GitHub Pages
name: Deploy Documentation

# Trigger conditions
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'mkdocs-requirements.txt'
      - 'mkdocs_hooks/**'
      - 'VERSION'
      - 'feps/**'
      - 'victor/**'
      - 'victor-contracts/**'
      - 'scripts/ci/docs_link_check.py'
      - 'tests/unit/scripts/test_docs_link_check.py'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'mkdocs-requirements.txt'
      - 'mkdocs_hooks/**'
      - 'VERSION'
      - 'feps/**'
      - 'victor/**'
      - 'victor-contracts/**'
      - 'scripts/ci/docs_link_check.py'
      - 'tests/unit/scripts/test_docs_link_check.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:  # Allow manual trigger

# Set permissions for GitHub Pages deployment
permissions:
  contents: read

# Allow only one concurrent deployment
concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

# Environment variables
env:
  PYTHON_VERSION: "3.12"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Fetch all history for git-revision-date plugin

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: mkdocs-requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install -r mkdocs-requirements.txt

      - name: Build documentation
        run: mkdocs build

      - name: Check built-site links and anchors (advisory)
        continue-on-error: true
        run: python scripts/ci/docs_link_check.py site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site

  # Deploy job
  deploy:
    # Deploy on push to main, or on a manual workflow_dispatch (so docs can be (re)published
    # on demand after promotion). The github-pages environment permits main only.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
