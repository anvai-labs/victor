name: CI - Contracts

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Contracts (Py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install contracts test dependencies
        run: python -m pip install -e "./victor-contracts[dev]"

      - name: Test contracts and enforce measured coverage floor
        working-directory: victor-contracts
        run: |
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            pytest tests -v --tb=short \
              --cov=victor_contracts \
              --cov=victor_sdk \
              --cov-report=term-missing \
              --cov-report=xml:coverage.xml \
              --cov-fail-under=50
          else
            pytest tests -v --tb=short
          fi

  build:
    name: Build Contracts Wheel
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build and validate distribution metadata
        run: |
          python -m pip install build twine
          python -m build victor-contracts
          twine check victor-contracts/dist/*
          python -m pip install victor-contracts/dist/*.whl
          python -c "import victor_contracts, victor_sdk; print(victor_contracts.__version__)"

  summary:
    name: Contracts Summary
    runs-on: ubuntu-latest
    needs: [test, build]
    if: always()
    steps:
      - name: Require tests, coverage, and built-wheel smoke test
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::Contracts tests, coverage, or built wheel validation did not pass."
            exit 1
          fi
