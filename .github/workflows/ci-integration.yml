# Integration Tests - Only runs when integration code changes
# Path-triggered to save CI resources

name: CI - Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-24.04
    # 30m: core-integration runs single-process (see below); parallel workers
    # multiplied the torch runtime past the runner pool's memory ceiling and
    # got the job evicted mid-run (exit 143 runner shutdown, 5 occurrences).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        test-suite:
          - name: provider-integration
            path: tests/integration/providers
          - name: workflow-integration
            path: tests/integration/workflows
          - name: tool-integration
            path: tests/integration/tools
          # Everything not owned by a suite above (agent, framework, multi_agent,
          # hitl, streaming, storage, top-level files, and any new directory), so
          # integration tests can no longer exist without running anywhere.
          # verticals/ is owned by the verticals-integration job below.
          - name: core-integration
            # Single-process, like the sibling suites: this job installs torch,
            # so N xdist workers means N full runtimes — on the runner pool that
            # exceeded the memory ceiling and the runner was evicted ~3 minutes
            # in (exit 143 "runner has received a shutdown signal") with -n auto
            # AND with -n 4, while every single-process sibling suite ran green.
            path: >-
              tests/integration
              --ignore=tests/integration/providers
              --ignore=tests/integration/workflows
              --ignore=tests/integration/tools
              --ignore=tests/integration/verticals
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-integration-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-integration-
            ${{ runner.os }}-pip-


      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ./victor-contracts
          pip install -e ".[dev]"
          # Shared code->CPG parser: graph_rag and storage/graph integration
          # tests import victor_codegraph (ADR-014).
          pip install -e ./victor-codegraph

      - name: Run integration tests
        run: |
          pytest ${{ matrix.test-suite.path }} \
            -v \
            --tb=short

  # Test with external vertical packages installed
  verticals-integration:
    name: Verticals Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-verticals-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-verticals-
            ${{ runner.os }}-pip-


      - name: Install victor with verticals
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Install the in-repo SDK and core first ([dev] so pytest is
          # available for the integration suites below).
          pip install -e ./victor-contracts
          pip install -e ".[dev]"
          # Foundational shared code->CPG parser (verticals delegate to it, ADR-014).
          pip install -e ./victor-codegraph

      - name: Install external vertical packages
        run: |
          # All verticals' standalone repos are archived — they now live in this monorepo.
          # Install the local copies so integration tests exercise the tracked source.
          # Folds verified complete (superset of each archived repo; all import cleanly).
          pip install -e ./verticals/victor-coding
          pip install -e ./verticals/victor-devops
          pip install -e ./verticals/victor-rag
          pip install -e ./verticals/victor-dataanalysis
          pip install -e ./verticals/victor-research

      - name: Install external vertical example (contract-first proof package)
        run: |
          # The contract-only example vertical (examples/external_vertical) is
          # the reference for third-party vertical authoring; installing it here
          # lets the verticals integration suite exercise its install/discovery
          # path end-to-end.
          pip install ./examples/external_vertical

      - name: Verify vertical packages are installed
        run: |
          echo "=== Checking vertical package installations ==="
          python -c "from victor_coding import CodingAssistant; print('✓ victor-coding installed')"
          python -c "from victor_rag import RAGAssistant; print('✓ victor-rag installed')"
          python -c "from victor_research import ResearchAssistant; print('✓ victor-research installed')"
          python -c "from victor_devops import DevOpsAssistant; print('✓ victor-devops installed')"
          python -c "from victor_dataanalysis import DataAnalysisAssistant; print('✓ victor-dataanalysis installed')"

      - name: Verify vertical entry points are discoverable
        run: |
          echo "=== Checking vertical entry point discovery ==="
          python - <<'PY'
          from importlib.metadata import entry_points
          for group in ("victor.plugins", "victor.verticals"):
              try:
                  victor_eps = entry_points(group=group)
                  print(f"Found {len(victor_eps)} entry points in {group}:")
                  for ep in victor_eps:
                      print(f"  - {ep.name}: {ep.value}")
              except Exception as e:
                  print(f"Error loading {group}: {e}")
          PY

      - name: Test vertical loading via core framework
        run: |
          echo "=== Testing vertical loading through victor.core ==="
          python - <<'PY'
          from victor.core.verticals import load_vertical

          # Test loading each vertical by name
          verticals_to_test = ["coding", "rag", "research", "devops", "dataanalysis"]

          for vertical_name in verticals_to_test:
              try:
                  vertical = load_vertical(vertical_name)
                  print(f"✓ {vertical_name}: {vertical.__name__}")
              except Exception as e:
                  print(f"✗ {vertical_name}: {e}")
          PY

      - name: Run verticals integration suite (incl. external vertical install/discovery)
        run: |
          # The whole directory: the slow isolated-venv install/discovery proofs
          # (test_external_vertical_install_discovery.py and friends) AND the
          # non-slow suites. A former `-m slow` filter left ~70 tests here running
          # in no workflow, which is how stale circuit-breaker tests rotted (#1471).
          pytest tests/integration/verticals -q --tb=short

      - name: Run framework tests with verticals
        run: |
          # Path fixed 2026-08-01: the old target
          # tests/unit/framework/test_vertical_integration.py no longer exists
          # (split into _cache/_metadata), so this step silently ran nothing.
          pytest tests/unit/framework/test_vertical_integration_cache.py \
            tests/unit/framework/test_vertical_integration_metadata.py \
            -v \
            --tb=short \
            -m "not slow"

  # Rust native extensions
  rust-native:
    name: Rust Native Extensions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Rust code
        run: cd rust && cargo check

      - name: Clippy lints
        run: cd rust && cargo clippy --all-targets -- -D warnings
        continue-on-error: true

  integration-summary:
    name: Integration Summary
    runs-on: ubuntu-24.04
    needs: [integration, verticals-integration, rust-native]
    if: always()
    steps:
      - name: Require every integration surface green
        run: |
          results=(
            "${{ needs.integration.result }}"
            "${{ needs.verticals-integration.result }}"
            "${{ needs.rust-native.result }}"
          )
          printf 'Integration job result: %s\n' "${results[@]}"
          for result in "${results[@]}"; do
            if [ "$result" != "success" ]; then
              echo "::error::At least one integration surface did not pass."
              exit 1
            fi
          done
