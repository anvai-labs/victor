# Integration Tests - Only runs when integration code changes
# Path-triggered to save CI resources

name: CI - Integration Tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-integration.yml'
      - 'victor/**'
      - 'victor-contracts/**'
      - 'examples/external_vertical/**'
      - 'tests/integration/**'
      - 'tests/e2e/**'
      - 'pyproject.toml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci-integration.yml'
      - 'victor/**'
      - 'victor-contracts/**'
      - 'examples/external_vertical/**'
      - 'tests/integration/**'
      - 'tests/e2e/**'
      - 'pyproject.toml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test-suite:
          - name: provider-integration
            path: tests/integration/providers
          - name: workflow-integration
            path: tests/integration/workflows
          - name: tool-integration
            path: tests/integration/tools
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-integration-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-integration-
            ${{ runner.os }}-pip-


      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ./victor-contracts
          pip install -e ".[dev]"

      - name: Run integration tests
        run: |
          rc=0
          pytest ${{ matrix.test-suite.path }} \
            -v \
            --tb=short \
            -m integration \
            || rc=$?
          # pytest exit 5 = no tests matched the marker in this suite
          # (e.g. tests/integration/tools has no integration-marked tests) —
          # treat as pass, fail on anything else.
          if [ "$rc" -eq 5 ]; then
            echo "No integration-marked tests in ${{ matrix.test-suite.path }} (pytest exit 5) — treating as pass."
            rc=0
          fi
          exit $rc

  # Test with external vertical packages installed
  verticals-integration:
    name: Verticals Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-verticals-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-verticals-
            ${{ runner.os }}-pip-


      - name: Install victor with verticals
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Install the in-repo SDK and core first ([dev] so pytest is
          # available for the integration suites below).
          pip install -e ./victor-contracts
          pip install -e ".[dev]"
          # Foundational shared code->CPG parser (verticals delegate to it, ADR-014).
          pip install -e ./victor-codegraph

      - name: Install external vertical packages
        run: |
          # All verticals' standalone repos are archived — they now live in this monorepo.
          # Install the local copies so integration tests exercise the tracked source.
          # Folds verified complete (superset of each archived repo; all import cleanly).
          pip install -e ./verticals/victor-coding
          pip install -e ./verticals/victor-devops
          pip install -e ./verticals/victor-rag
          pip install -e ./verticals/victor-dataanalysis
          pip install -e ./verticals/victor-research

      - name: Install external vertical example (contract-first proof package)
        run: |
          # The contract-only example vertical (examples/external_vertical) is
          # the reference for third-party vertical authoring; installing it here
          # lets the verticals integration suite exercise its install/discovery
          # path end-to-end.
          pip install ./examples/external_vertical

      - name: Verify vertical packages are installed
        run: |
          echo "=== Checking vertical package installations ==="
          python -c "from victor_coding import CodingAssistant; print('✓ victor-coding installed')" || echo "✗ victor-coding not found"
          python -c "from victor_rag import RAGAssistant; print('✓ victor-rag installed')" || echo "✗ victor-rag not found"
          python -c "from victor_research import ResearchAssistant; print('✓ victor-research installed')" || echo "✗ victor-research not found"
          python -c "from victor_devops import DevOpsAssistant; print('✓ victor-devops installed')" || echo "✗ victor-devops not found"
          python -c "from victor_dataanalysis import DataAnalysisAssistant; print('✓ victor-dataanalysis installed')" || echo "✗ victor-dataanalysis not found"

      - name: Verify vertical entry points are discoverable
        run: |
          echo "=== Checking vertical entry point discovery ==="
          python - <<'PY'
          from importlib.metadata import entry_points
          for group in ("victor.plugins", "victor.verticals"):
              try:
                  victor_eps = entry_points(group=group)
                  print(f"Found {len(victor_eps)} entry points in {group}:")
                  for ep in victor_eps:
                      print(f"  - {ep.name}: {ep.value}")
              except Exception as e:
                  print(f"Error loading {group}: {e}")
          PY

      - name: Test vertical loading via core framework
        run: |
          echo "=== Testing vertical loading through victor.core ==="
          python - <<'PY'
          from victor.core.verticals import load_vertical

          # Test loading each vertical by name
          verticals_to_test = ["coding", "rag", "research", "devops", "dataanalysis"]

          for vertical_name in verticals_to_test:
              try:
                  vertical = load_vertical(vertical_name)
                  print(f"✓ {vertical_name}: {vertical.__name__}")
              except Exception as e:
                  print(f"✗ {vertical_name}: {e}")
          PY

      - name: Run verticals integration suite (incl. external vertical install/discovery)
        run: |
          # -m slow selects the isolated-venv install/discovery proofs
          # (tests/integration/verticals/test_external_vertical_install_discovery.py
          # and friends) that were previously never executed in CI.
          pytest tests/integration/verticals -m slow -q --tb=short

      - name: Run framework tests with verticals
        run: |
          # Path fixed 2026-08-01: the old target
          # tests/unit/framework/test_vertical_integration.py no longer exists
          # (split into _cache/_metadata), so this step silently ran nothing.
          pytest tests/unit/framework/test_vertical_integration_cache.py \
            tests/unit/framework/test_vertical_integration_metadata.py \
            -v \
            --tb=short \
            -m "not slow"

  # VS Code Extension tests
  vscode-extension:
    name: VS Code Extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' || contains(github.event.head_commit.message, '[vscode]')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-victor/package-lock.json

      - name: Install dependencies
        working-directory: vscode-victor
        run: npm ci

      - name: Build webview UI
        working-directory: vscode-victor/webview-ui
        run: npm ci && npm run build

      - name: Lint
        working-directory: vscode-victor
        run: npm run lint
        continue-on-error: true

      - name: Compile
        working-directory: vscode-victor
        run: npm run compile

      - name: Unit tests + coverage (vitest/c8)
        working-directory: vscode-victor
        run: npm run coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: vscode-coverage
          path: vscode-victor/coverage
          if-no-files-found: ignore

      - name: Run tests
        working-directory: vscode-victor
        run: xvfb-run -a npm test
        continue-on-error: true

      - name: Package VSIX
        working-directory: vscode-victor
        run: npx vsce package --no-dependencies

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: vscode-victor/*.vsix

  # Rust native extensions
  rust-native:
    name: Rust Native Extensions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            rust/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Rust code
        run: cd rust && cargo check

      - name: Clippy lints
        run: cd rust && cargo clippy --all-targets -- -D warnings
        continue-on-error: true
