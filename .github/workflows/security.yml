# Security Scanning - Runs in parallel with other CI jobs
# Combines multiple security tools for comprehensive coverage

name: Security Scanning

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/security.yml'
      - 'victor/**'
      - 'victor-contracts/**'
      - 'rust/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'Dockerfile'
      - 'docker/**'
      - 'docker-compose*.yml'
      - '**/pyproject.toml'
      - '**/requirements*.txt'
      - '**/package.json'
      - '**/package-lock.json'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/Dockerfile*'
      - '**/.github/**'
      - '.github/actions/**'
      - '.github/security/**'
      - 'constraints.txt'
      - 'mkdocs-requirements.txt'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/security.yml'
      - 'victor/**'
      - 'victor-contracts/**'
      - 'rust/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'Dockerfile'
      - 'docker/**'
      - 'docker-compose*.yml'
      - '**/pyproject.toml'
      - '**/requirements*.txt'
      - '**/package.json'
      - '**/package-lock.json'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '**/Dockerfile*'
      - '**/.github/**'
      - '.github/actions/**'
      - '.github/security/**'
      - 'constraints.txt'
      - 'mkdocs-requirements.txt'
  schedule:
    # Run weekly on Monday at 2 AM UTC (backstop for newly-disclosed advisories;
    # per-PR Trivy gates CRITICAL deps and develop->main runs the full scan)
    - cron: '0 2 * * 1'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb # v8.30.1 (linux/amd64)
        with:
          args: git /github/workspace --redact --verbose --no-banner

  trivy-critical:
    name: Critical Filesystem Scan (Trivy, Blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/security-scan
        with:
          scope: filesystem
          scan-type: fs
          minimum: CRITICAL
          category: repository-dependencies

  dependency-audit:
    name: Dependency Audit (High+Critical Blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install package for audit
        run: |
          python -m pip install -e ./victor-contracts
          python -m pip install -e .
      - uses: ./.github/actions/python-audit

  code-security:
    name: Code Security (Bandit, High-Severity Blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit (high+critical severity blocking)
        run: |
          bandit -r victor/ \
            -f json \
            -o bandit-report.json \
            --severity-level high \
            --confidence-level high \
            -s B101,B324 \
            --ini .bandit
        # Blocks on HIGH severity + HIGH confidence findings.
        # Lower severity findings are still reported in the artifact.
        # To add exceptions, use # nosec inline or .bandit config.

      - name: Run Bandit full report (advisory)
        if: always()
        run: |
          bandit -r victor/ \
            -f json \
            -o bandit-report-full.json \
            -s B101,B324 \
            --ini .bandit \
            || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bandit-report
          path: |
            bandit-report.json
            bandit-report-full.json
          retention-days: 30

  sast-scan:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install and run Semgrep
        run: |
          pip install semgrep
          semgrep scan \
            --config auto \
            --sarif --output semgrep.sarif \
            --exclude 'archive/*' \
            --exclude 'docs/*' \
            --exclude 'tests/*' \
            --exclude 'examples/*' \
            --exclude 'vscode-victor/*' \
            || true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Drop nosemgrep-suppressed findings from SARIF
        # Semgrep emits in-source-suppressed findings (`# nosemgrep: <rule-id>`
        # with a written justification — repo precedent: outcome_training.py,
        # graph_tool.py) into the SARIF with `suppressions: [{kind: inSource}]`,
        # but GitHub code scanning does not honor the SARIF suppressions
        # property and opens alerts for them anyway. Strip suppressed results
        # before upload so the code-scanning gate matches semgrep's own
        # verdict. Rule coverage is unchanged — only findings an engineer
        # explicitly suppressed inline (per-rule-id, with justification) are
        # excluded.
        if: hashFiles('semgrep.sarif') != ''
        run: |
          python3 - <<'EOF'
          import json

          with open("semgrep.sarif") as fh:
              sarif = json.load(fh)
          dropped = 0
          for run in sarif.get("runs", []):
              results = run.get("results", [])
              kept = [r for r in results if not r.get("suppressions")]
              dropped += len(results) - len(kept)
              run["results"] = kept
          with open("semgrep.sarif", "w") as fh:
              json.dump(sarif, fh)
          print(f"Dropped {dropped} in-source-suppressed finding(s) from SARIF")
          EOF

      - name: Upload Semgrep results
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  license-scan:
    name: License Compliance (Advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pip-licenses
        run: pip install pip-licenses

      - name: Generate license report
        run: |
          pip-licenses \
            --format=json \
            --output-file=license-report.json \
            --with-system \
            || true
        # Advisory because license compatibility still requires human review and policy decisions.
        continue-on-error: true

      - name: Upload license report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: license-report
          path: license-report.json
          retention-days: 30
