# Optimized Build Workflow - Build all artifacts in parallel
# Only runs on main/develop or when explicitly triggered

name: Build Artifacts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'victor/**'
      - 'victor-contracts/**'
      - 'rust/**'
      # benchmarks/ ships no package artifact, but "Build Python Package" is a REQUIRED
      # status check — a PR whose paths trigger no build run is unmergeable (workflow_dispatch
      # runs do not satisfy the PR's expected-context tracking; verified on PR #379).
      - 'benchmarks/**'
      - 'pyproject.toml'
      - 'requirements*.txt'
      - 'MANIFEST.in'
      - 'VERSION'
      - 'Dockerfile'
      - 'docker/**'
      - 'docker-compose*.yml'
  # No path filter on pull_request: "Build Python Package" is a REQUIRED status check,
  # so it must run on EVERY PR — a PR whose paths trigger no build run is permanently
  # unmergeable (workflow_dispatch runs on the head SHA do not satisfy the PR's
  # expected-context tracking; verified twice on PR #379). The job costs ~30s.
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build Python packages
  build-python:
    name: Build Python Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Cache pip build dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-build-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-build-
            ${{ runner.os }}-pip-

      - name: Install build tools
        run: |
          pip install --upgrade pip
          pip install build wheel twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package
          path: dist/
          retention-days: 7

  # Build a local Docker image artifact without remote Buildx bootstrap
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo apt-get clean
          docker system prune -af --volumes || true

      - name: Build Docker image
        run: |
          docker build -t victor:latest .
          docker save -o /tmp/victor-docker.tar victor:latest

      - name: Upload Docker image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image
          path: /tmp/victor-docker.tar
          retention-days: 7

  # Build VS Code extension
  build-vscode:
    name: Build VS Code Extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-victor/package-lock.json

      - name: Install dependencies
        working-directory: vscode-victor
        run: npm ci

      - name: Build webview UI
        working-directory: vscode-victor/webview-ui
        run: npm ci && npm run build

      - name: Compile TypeScript
        working-directory: vscode-victor
        run: npm run compile

      - name: Package VSIX
        working-directory: vscode-victor
        run: npx vsce package --no-dependencies

      - name: Upload VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-extension
          path: vscode-victor/*.vsix
          retention-days: 7

  # Build summary
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-python, build-docker, build-vscode]
    if: always()
    steps:
      - name: Check build results
        run: |
          echo "Python package: ${{ needs.build-python.result }}"
          echo "Docker image: ${{ needs.build-docker.result }}"
          echo "VS Code extension: ${{ needs.build-vscode.result }}"

          if [ "${{ needs.build-python.result }}" == "success" ] && \
             [ "${{ needs.build-docker.result }}" == "success" ] && \
             [ "${{ needs.build-vscode.result }}" == "success" ]; then
            echo "✅ All builds succeeded"
            exit 0
          else
            echo "❌ Some builds failed"
            exit 1
          fi
