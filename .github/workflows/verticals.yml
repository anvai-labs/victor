# In-repo first-party verticals (folded under verticals/).
# - Contract-boundary audit is BLOCKING: verticals must import only
#   victor_contracts, never victor framework internals.
# - Per-vertical test suites are BLOCKING (they pass green in-monorepo).
# - Per-vertical lint: ruff is BLOCKING (each package's ruff config aligned with
#   the framework's); black (formatting) + mypy (types) are ADVISORY while that
#   folded-in debt is cleared.
name: Verticals

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundaries:
    name: Contract-boundary audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify runner ABI
        run: >-
          python3 scripts/ci/runner_preflight.py
          --require-os ubuntu
          --min-os-version 24.04
          --min-glibc 2.38
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Audit vertical contract boundaries
        run: python scripts/ci/check_extracted_vertical_boundaries.py

  test:
    name: Vertical tests (Py${{ matrix.python-version }})
    # ubuntu-24.04 also matches the organization's self-hosted overflow hosts.
    # These tests execute LanceDB's native wheel, which SIGILLs on dataserver2.
    # Keep native workloads on the compatible standard hosted image.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify runner ABI
        run: >-
          python3 scripts/ci/runner_preflight.py
          --require-os ubuntu
          --min-os-version 24.04
          --min-glibc 2.38
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install framework + contracts + verticals (editable)
        run: make install-verticals
      - name: Verify LanceDB native backend compatibility
        run: |
          python -c "import lancedb; print('LanceDB native import OK:', lancedb.__version__)"
      - name: Run vertical test suites
        run: |
          if [ "${{ matrix.python-version }}" != "3.12" ]; then
            make test-verticals
            exit 0
          fi

          # Each vertical owns a top-level `tests` package, so execute them in
          # isolated pytest processes.  Per-package floors preserve honest
          # baselines while coding/RAG coverage debt is paid down.
          for spec in \
            "coding victor_coding 33" \
            "devops victor_devops 80" \
            "rag victor_rag 20" \
            "dataanalysis victor_dataanalysis 75" \
            "research victor_research 80"; do
            read -r vertical module floor <<< "$spec"
            (
              cd "verticals/victor-${vertical}"
              pytest tests -q --tb=short \
                --cov="$module" \
                --cov-report=term-missing \
                --cov-fail-under="$floor"
            )
          done
          make check-vertical-test-floor

  lint:
    name: Vertical lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify runner ABI
        run: >-
          python3 scripts/ci/runner_preflight.py
          --require-os ubuntu
          --min-os-version 24.04
          --min-glibc 2.38
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install framework + contracts + verticals (editable)
        run: make install-verticals
      - name: Ruff (blocking)
        run: make lint-verticals-ruff
      - name: Black + mypy (advisory)
        continue-on-error: true  # advisory while the folded verticals' format/type debt is cleared
        run: make lint-verticals-fmt-types

  summary:
    name: Verticals Summary
    runs-on: ubuntu-24.04
    needs: [boundaries, test, lint]
    if: always()
    steps:
      - name: Require boundaries, test floors, tests, and blocking lint
        run: |
          if [ "${{ needs.boundaries.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ]; then
            echo "::error::Vertical boundaries, tests, test-count floors, or blocking lint did not pass."
            exit 1
          fi
