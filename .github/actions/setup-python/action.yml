name: 'Setup Python with Dependencies'
description: 'Composite action to set up Python with caching and install Victor dependencies'

inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.11'
  install-dev:
    description: 'Install dev dependencies'
    required: false
    default: 'true'
  cache-key-prefix:
    description: 'Prefix for cache key'
    required: false
    default: 'victor'

runs:
  using: 'composite'
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/pip
          ~/.cache/pipenv
        key: ${{ inputs.cache-key-prefix }}-${{ runner.os }}-pip-${{ inputs.python-version }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
        restore-keys: |
          ${{ inputs.cache-key-prefix }}-${{ runner.os }}-pip-${{ inputs.python-version }}-
          ${{ inputs.cache-key-prefix }}-${{ runner.os }}-pip-

    - name: Cache pytest
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .pytest_cache
        key: ${{ inputs.cache-key-prefix }}-${{ runner.os }}-pytest-${{ github.run_id }}
        restore-keys: |
          ${{ inputs.cache-key-prefix }}-${{ runner.os }}-pytest-

    - name: Install dependencies
      shell: bash
      env:
        INSTALL_DEV: ${{ inputs.install-dev }}
      run: |
        python -m pip install --upgrade pip
        # Use CPU-only torch for faster CI
        pip install torch --index-url https://download.pytorch.org/whl/cpu

        if [ "$INSTALL_DEV" == "true" ]; then
          pip install -e ".[dev]"
        else
          pip install -e .
        fi
