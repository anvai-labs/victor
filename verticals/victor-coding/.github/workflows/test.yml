name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Clone and install main victor framework from develop branch FIRST
          git clone --branch develop https://github.com/anvai-labs/victor.git /tmp/victor-framework
          # Install victor-contracts first (required by victor-ai and verticals)
          pip install -e "/tmp/victor-framework/victor-contracts[yaml]"
          # Install victor-ai framework
          pip install -e /tmp/victor-framework
          # Now install the vertical
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short -n auto --dist loadscope

      - name: Check coverage
        run: |
          pytest tests/ --cov=victor_coding --cov-report=term-missing
